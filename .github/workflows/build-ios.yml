name: Build and Deploy iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v6

      - name: Import certificate
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" build.keychain

      - name: Import provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode \
            > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create empty Secrets.xcconfig
        run: touch RedCalendar-Female/Secrets.xcconfig

      - name: Build archive
        run: |
          xcodebuild archive \
            -scheme RedCalendar-Production \
            -archivePath build/RedCalendar.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=43YQFDZNH8 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            APPMETRICA_API_KEY=${{ secrets.APPMETRICA_API_KEY }}

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/RedCalendar.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist ExportOptions.plist

      - name: Prepare API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload to TestFlight
        run: |
          # The build number, on the record. It is the run number and nothing else, so
          # a re-run of a failed job carries the number that already went up — which is
          # exactly the rejection hardest to recognise from altool's wording.
          echo "Uploading build ${{ github.run_number }}"

          # errexit is on for this step (bash -e), and it used to kill the job on
          # altool's own exit code — while the output was still inside the command
          # substitution, so the job failed with nothing printed and the grep below
          # never ran at all. Turned off around the call so the output is echoed
          # first and the status is judged afterwards.
          set +e
          output=$(xcrun altool --upload-app \
            -f build/RedCalendar-Female.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} 2>&1)
          status=$?
          set -e

          echo "$output"

          # Both, because neither alone is enough: altool has been known to report a
          # refused upload in its output while exiting 0, and to exit non-zero on
          # failures that never print that phrase.
          if [ "$status" -ne 0 ] || echo "$output" | grep -q "UPLOAD FAILED"; then
            echo "::error::Upload of build ${{ github.run_number }} failed (altool exit ${status}) — see the altool output above."
            exit 1
          fi
